pluginManagement {
    repositories {
        // Prefer the Aliyun mirrors for networks where services.gradle.org or
        // the default plugin portal is slow; official repositories remain a
        // fallback for environments where the mirror is unavailable.
        maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        google()
        mavenCentral()
    }
}

rootProject.name = 'game2apk-rpgmv-template'
include ':app'
