plugins {
    id 'com.android.application'
}

def requiredOrDefault = { String propertyName, String defaultValue ->
    providers.gradleProperty(propertyName).orElse(defaultValue).get()
}

android {
    namespace 'com.game2apk.rpgmv'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        // Keep the standalone template on the same package identity as the
        // generated app so a rebuild can be installed as an update.
        applicationId requiredOrDefault('game2apkApplicationId', 'com.game2apk.xianyaoshengcanver22')
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(requiredOrDefault('game2apkVersionCode', '6'))
        versionName requiredOrDefault('game2apkVersionName', '1.1.0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        noCompress += ['rpgmvp', 'rpgmvo', 'rpgmvm', 'ogg', 'm4a', 'mp3', 'wav', 'webm']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                maxParallelForks = 1
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
