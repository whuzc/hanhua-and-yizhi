<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Game2Apk synthetic MV input fixture</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #101722; color: #eaf2ff; font-family: sans-serif; }
        body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
        main { width: min(90vw, 900px); padding: 24px; border: 1px solid #49627e; border-radius: 16px; background: #182333; box-sizing: border-box; }
        h1 { margin-top: 0; font-size: 24px; }
        #state { color: #9ee493; font-family: monospace; white-space: pre-wrap; }
        #events { max-height: 36vh; overflow: hidden; font-family: monospace; font-size: 13px; color: #bed0e8; }
        .note { color: #a9b8ca; line-height: 1.5; }
    </style>
</head>
<body>
<main>
    <h1>RPG Maker MV synthetic fixture</h1>
    <p class="note">This tiny page exists only to verify the template build and the native key bridge. It contains no game assets or saves.</p>
    <div id="state">Waiting for input…</div>
    <div id="events"></div>
</main>
<script src="js/rpg_core.js"></script>
<script src="game2apk-input.js"></script>
<script>
    (function () {
        var state = document.getElementById('state');
        var events = document.getElementById('events');
        function render() {
            var current = window.Input._currentState;
            var active = [];
            Object.keys(current).forEach(function (key) {
                if (current[key]) { active.push(key); }
            });
            state.textContent = 'Mapped state: ' + (active.length ? active.join(', ') : 'none');
            events.textContent = window.Input._events.slice(-12).map(function (event) {
                return event.type + ' keyCode=' + event.keyCode + ' mapped=' + (event.mapped || 'none');
            }).join('\n');
        }
        window.setInterval(render, 100);
        render();
    }());
</script>
</body>
</html>
